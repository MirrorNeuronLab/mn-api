[project]
name = "mirrorneuron-api"
dynamic = ["version"]
description = "MirrorNeuron REST API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mirrorneuron-python-sdk",
    "fastapi>=0.100.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.23.0"
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.scripts]
mn-api = "mn_api.main:start"
mn-web-ui-server = "mn_api.web_ui_server:start"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0.0"
local_scheme = "no-local-version"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"mn_api/config.py" = ["E402"]
"mn_api/path_utils.py" = ["E402", "F401"]
"mn_api/state.py" = ["E402"]
