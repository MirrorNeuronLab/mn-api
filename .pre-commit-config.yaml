minimum_pre_commit_version: 4.5.1
default_install_hook_types:
  - pre-push
default_stages:
  - pre-push
exclude: (^|/)(?:[^/]+_pb2(?:_grpc)?\.py|[^/]+\.pb\.ex)$|^install_support/
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: ruff check --force-exclude
        language: python
        additional_dependencies:
          - ruff==0.15.7
        types_or:
          - python
          - pyi
      - id: ruff-format
        name: ruff-format
        entry: ruff format --check --force-exclude
        language: python
        additional_dependencies:
          - ruff==0.15.7
        types_or:
          - python
          - pyi
      - id: shell-syntax
        name: Shell syntax
        entry:
          python -c "import subprocess, sys; sys.exit(any(subprocess.call([\"bash\",
          \"-n\", f]) for f in sys.argv[1:]))"
        language: python
        files: \.sh$
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: python
        additional_dependencies:
          - shellcheck-py==0.11.0.1
        types:
          - shell
      - id: shfmt
        name: Shell formatting
        entry: shfmt -d -i 2
        language: python
        additional_dependencies:
          - shfmt-py==3.12.0.2
        types:
          - shell
      - id: check-json
        name: JSON syntax
        entry: check-json
        language: python
        additional_dependencies:
          - pre-commit-hooks==6.0.0
        types:
          - json
      - id: check-toml
        name: TOML syntax
        entry: check-toml
        language: python
        additional_dependencies:
          - pre-commit-hooks==6.0.0
        types:
          - toml
      - id: check-yaml
        name: YAML syntax
        entry: check-yaml --allow-multiple-documents
        language: python
        additional_dependencies:
          - pre-commit-hooks==6.0.0
        types:
          - yaml
      - id: prettier
        name: Prettier formatting
        entry: prettier --check
        language: node
        additional_dependencies:
          - prettier@3.6.2
        types_or:
          - markdown
          - json
          - yaml
          - javascript
          - jsx
          - ts
          - tsx
          - css
          - html
